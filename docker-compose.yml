# EasyOVL - only the web console runs from this file.
# The console then generates and manages the Overleaf stack itself
# (data/stack/docker-compose.yml, compose project "overleaf").
#
# This file is all you need: download it into an empty folder and run
#   docker compose up -d
# then open http://localhost:8090 (or http://<server-ip>:8090).
name: easyovl

services:
  manager:
    image: ghcr.io/bidabrain/easyovl:latest
    container_name: easyovl-manager
    restart: unless-stopped
    ports:
      # Reachable from your LAN by default. To allow only this computer,
      # set EASYOVL_BIND=127.0.0.1 in a .env file next to this file.
      - "${EASYOVL_BIND:-0.0.0.0}:${EASYOVL_PORT:-8090}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
